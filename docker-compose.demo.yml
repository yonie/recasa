# Demo instance for screenshots - uses stock CC0 photos, separate port
# MUST NOT touch the production instance on port 7000
services:
  recasa-demo:
    image: recasa-recasa:latest
    ports:
      - "7002:8080"
    volumes:
      - ./demo-photos:/photos:ro
      - recasa_demo_data:/data
    environment:
      - PHOTOS_DIR=/photos
      - DATA_DIR=/data
      - ENABLE_GEOCODING=true
      - ENABLE_FACE_DETECTION=true
      - ENABLE_CAPTIONING=true
      - OLLAMA_URL=http://host.docker.internal:11434
      - LOG_LEVEL=info
      - MAX_CONCURRENT=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  recasa_demo_data: