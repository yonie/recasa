# Included inside the http {} block of the stock nginx.conf (it is installed
# as sites-enabled/default), so upstream and map are allowed here.

# Reuse connections to uvicorn instead of opening one per request: the
# frontend fires dozens of small API calls per page.
upstream recasa_api {
    server 127.0.0.1:8000;
    keepalive 16;
    # Below uvicorn's 5s keep-alive, so nginx never reuses a connection that
    # uvicorn is just closing.
    keepalive_timeout 4s;
}

# "upgrade" only for real WebSocket handshakes; plain requests send an empty
# Connection header so the upstream connection can be kept alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    autoindex off;

    # The only uploads are user-data imports: names and faceprints, about
    # 20 MB for the live library.
    client_max_body_size 100m;

    # Compress JSON/JS/CSS responses (timeline JSON alone is ~1MB raw)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/recasa-security-headers.conf;

    # Frontend static files. index.html must always revalidate so a cached
    # shell never references stale hashed bundles after an upgrade.
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/recasa-security-headers.conf;
    }

    # Hashed frontend assets (Vite adds content hash to filenames)
    location /assets/ {
        root /app/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/recasa-security-headers.conf;
    }

    # Thumbnails straight from disk: the grid requests hundreds at a time and
    # these need no Python. Same file, type and Cache-Control as the API's
    # /api/photos/{hash}/thumbnail/{size} for the three generated sizes; any
    # other size, or a thumbnail not generated yet, goes to the API, which
    # picks the nearest size or renders it on demand. Assumes DATA_DIR=/data.
    location ~ "^/api/photos/(?<thumb_shard>[0-9a-f]{2})(?<thumb_rest>[0-9a-f]{62})/thumbnail/(?<thumb_size>200|600|1200)$" {
        root /data/thumbs;
        try_files /$thumb_shard/$thumb_shard${thumb_rest}_$thumb_size.webp @api;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/recasa-security-headers.conf;
    }

    # API proxy
    location /api/ {
        proxy_pass http://recasa_api;
        include /etc/nginx/snippets/recasa-proxy.conf;
    }

    location @api {
        proxy_pass http://recasa_api;
        include /etc/nginx/snippets/recasa-proxy.conf;
    }
}
