# Security headers, included by every location of nginx.conf that sets its own
# add_header (nginx drops inherited add_header lines in such a location).
# Installed as /etc/nginx/snippets/recasa-security-headers.conf.
#
# The CSP is what the current frontend needs and no more:
#   img-src     own API, data:/blob: URLs (collages are blob: images, Leaflet's
#               bundled marker and layer images are inlined) and OpenStreetMap tiles
#   style-src   'self' only: the map uses classes, not inline <style> or style="";
#               style properties React and Leaflet set from script are not covered
#   connect-src same origin, including the pipeline WebSocket
#   media-src   videos and live photos come from the API (or blob:)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
