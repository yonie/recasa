# Security headers, included by every location of nginx.conf that sets its own
# add_header (nginx drops inherited add_header lines in such a location).
# Installed as /etc/nginx/snippets/recasa-security-headers.conf.
#
# The CSP is what the current frontend needs and no more:
#   img-src     own API, data:/blob: URLs (collages are blob: images),
#               OpenStreetMap tiles and the Leaflet marker icons on cdnjs
#   style-src   'unsafe-inline' for the map page's <style> block and the
#               inline styles Leaflet and React set
#   connect-src same origin, including the pipeline WebSocket
#   media-src   videos and live photos come from the API (or blob:)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
